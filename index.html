<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; script-src-elem 'self'; script-src-attr 'none'; style-src 'self'; style-src-elem 'self'; style-src-attr 'none'; img-src 'self'; font-src 'none'; media-src 'none'; manifest-src 'self'; connect-src 'self'; worker-src 'none'; child-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; require-trusted-types-for 'script'; trusted-types 'none'">
        <meta name="description" content="Alpha Timer - a Pomodoro timer with tasks, work/break sessions and a light/dark theme.">
        <meta name="theme-color" content="#0a0a1a">
        <meta name="referrer" content="no-referrer">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Alpha Timer (By Alpha.Dev)</title>
        <link rel="stylesheet" href="assets/css/styles.css">
        <script src="assets/js/theme-toggle.js"></script>
        <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
        <link rel="icon" type="image/png" sizes="48x48" href="assets/icons/favicon-48.png">
        <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
        <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico" sizes="any">
        <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
        <link rel="manifest" href="manifest.json">
</head>
<body>
        <main class="container">
                <h1>Alpha Timer</h1>
                <div id="session-status" role="status">Work session</div>
                <div class="timer" id="timer" role="timer" aria-label="Time remaining" aria-live="off">25:00</div>
                <div class="controls">
                        <button type="button" id="start">Start</button>
                        <button type="button" id="skip">Skip</button>
                        <button type="button" id="reset">Reset</button>
                        <button type="button" id="toggle-theme" aria-pressed="false">Toggle Theme</button>
                </div>
                <noscript>
                        <p>Alpha Timer needs JavaScript enabled to work.</p>
                </noscript>
                <div class="task-list">
                        <h2>Tasks</h2>
                        <div id="tasks"></div>
                        <input type="text" id="task-input" placeholder="New task" aria-label="New task" maxlength="500" autocomplete="off" spellcheck="false">
                        <button type="button" id="add-task">Add Task</button>
                </div>
                <div class="settings">
                        <h2>Settings</h2>
                        <label for="work-duration">Work Duration (minutes):</label>
                        <input type="number" id="work-duration" value="25" min="1" max="1440" step="1" inputmode="numeric" autocomplete="off">
                        <br>
                        <label for="break-duration">Break Duration (minutes):</label>
                        <input type="number" id="break-duration" value="5" min="1" max="1440" step="1" inputmode="numeric" autocomplete="off">
                </div>
        </main>
        <footer>
                <p>Made by ALPHA.DEV &copy; <span id="year">2026</span> ALPHA.DEV. All rights reserved.</p>
        </footer>
        <script src="assets/js/timer.js"></script>
</body>
</html>
